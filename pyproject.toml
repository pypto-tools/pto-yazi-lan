[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yazi-lan"
version = "0.2.0"
description = "Two-pane SSH file transfers for Yazi on Linux"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["paramiko>=3.3,<6"]

[project.scripts]
yazi-lan = "yazi_lan.__main__:main"

[tool.setuptools]
packages = ["yazi_lan"]

[tool.setuptools.data-files]
"share/yazi-lan/yazi" = ["yazi/keymap.toml"]
"share/yazi-lan/yazi/plugins/lan-copy.yazi" = ["yazi/plugins/lan-copy.yazi/main.lua"]
