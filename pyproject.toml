[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pto-yazi-lan"
dynamic = ["version"]
description = "Two-pane SSH file transfers for Yazi on Linux"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["paramiko>=3.3,<6"]

[project.scripts]
pto-yazi-lan = "yazi_lan.__main__:main"

[tool.setuptools]
packages = ["yazi_lan"]

[tool.setuptools.dynamic]
version = {attr = "yazi_lan.__version__"}

[tool.setuptools.data-files]
"share/yazi-lan/scheduler" = ["packaging/pto-yazi-lan-sync.service", "packaging/pto-yazi-lan-sync.timer", "packaging/pto-yazi-lan-sync.cron"]
"share/yazi-lan/yazi" = ["yazi/keymap.toml"]
"share/yazi-lan/yazi/plugins/lan-copy.yazi" = ["yazi/plugins/lan-copy.yazi/main.lua"]
